name: Playwright Test Automation & AI Triage Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Playwright Test Execution
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeCheck & Static Analysis
        run: npm run typecheck

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test --reporter=json:playwright-report/results.json,html:playwright-report
        continue-on-error: true
        id: test_run

      - name: Upload Test Report & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Execute AI Failure Triage
        if: steps.test_run.outcome == 'failure'
        run: |
          npx ts-node scripts/ai-triage.ts playwright-report/results.json >> $GITHUB_STEP_SUMMARY

      - name: Enforce Exit Code
        if: steps.test_run.outcome == 'failure'
        run: exit 1
