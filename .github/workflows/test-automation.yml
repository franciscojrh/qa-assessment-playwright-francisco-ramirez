name: Playwright Test Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright Test Execution
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeCheck & Static Analysis
        run: npm run typecheck

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        run: npm run test:smoke
        env:
          CI: 'true'
          BASE_URL: ${{ vars.BASE_URL || 'https://playwright.dev' }}

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-traces-screenshots
          path: |
            test-results/**/*.zip
            test-results/**/*.png
          retention-days: 14
          if-no-files-found: ignore
